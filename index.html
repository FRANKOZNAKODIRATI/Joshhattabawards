<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Awards</title>
<style>
:root{--bg:#0e0b1a;--bg2:#1c1233;--card:#1a1530;--text:#f4f1ff;--mut:#a79fc4;--gold:#ffc857;--acc:#ff4f9a;--bd:#2f2650;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2ff;--bg2:#e6dcff;--card:#fff;--text:#1d1433;--mut:#6a5f8a;--gold:#c98a00;--acc:#d6246f;--bd:#d9cdf5}}
:root[data-theme="dark"]{--bg:#0e0b1a;--bg2:#1c1233;--card:#1a1530;--text:#f4f1ff;--mut:#a79fc4;--gold:#ffc857;--acc:#ff4f9a;--bd:#2f2650}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px;text-align:center}
.kick{color:var(--gold);letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;font-weight:700}
h1{margin:.3em 0 .2em;font-size:clamp(1.8rem,5vw,3rem)}
p.sub{color:var(--mut);margin:0 0 22px}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 22px}
.dots i{width:34px;height:5px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--gold)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:960px;margin:0 auto}
.grid.clips{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:10px;cursor:pointer;color:inherit;font:inherit;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.card:focus-visible{outline:3px solid var(--gold)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.card.sel::after{content:"✓";position:absolute;top:6px;right:6px;background:var(--gold);color:#1a1200;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.card img,.ph{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block}
.card .nm{margin-top:10px;font-weight:700;word-break:break-word}
.clips .thumb{aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#6a3df0,#ff4f9a);color:#fff;position:relative;overflow:hidden}
.thumb svg{width:56px;height:56px;opacity:.95}
.thumb em{position:absolute;left:10px;bottom:8px;font-style:normal;font-size:.75rem;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:99px}
.watch{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--mut);text-decoration:underline}
.bar{margin-top:30px;min-height:54px}
button.next{background:var(--gold);color:#1a1200;border:0;border-radius:99px;padding:15px 34px;font-size:1.05rem;font-weight:800;cursor:pointer;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.back{background:none;border:0;color:var(--mut);cursor:pointer;margin-top:14px;font-size:.9rem}
.sum{max-width:520px;margin:20px auto;text-align:left;display:grid;gap:10px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px}
.sum span{color:var(--mut)}
.hero{padding:40px 0}.g{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px auto;max-width:640px}
.chips span{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:8px 16px}.chips b{color:var(--gold);margin-right:4px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-width:760px;margin:0 auto 32px}
.steps div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;color:var(--mut)}.steps b{display:block;color:var(--gold);font-size:1.6rem}
a.next{display:inline-block;text-decoration:none}.note{font-size:.85rem}
</style></head><body><main id="app"></main>

const DEF='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#3b3160"/><circle cx="50" cy="38" r="18" fill="#8f84c2"/><path d="M14 100c2-26 18-38 36-38s34 12 36 38z" fill="#8f84c2"/></svg>');
const photo=n=>n===14?DEF:PH[n];
let step=-1,votes={};const MAIL='joshhattabawards@gmail.com',KEY='24378633-27a6-4c22-bdad-09b7af76120d';
async function sendVotes(){
  const st=document.getElementById('st');
  try{if(localStorage.getItem('awards-sent')==='1'){st.textContent='Your votes were sent ✓ Thank you!';return;}}catch(e){}
  try{
    const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:KEY,subject:'New awards votes',from_name:'Awards Website',message:mailBody()})});
    const j=await r.json();if(!j.success)throw new Error(j.message);
    try{localStorage.setItem('awards-sent','1');}catch(e){}
    st.textContent='Your votes were sent ✓ Thank you!';
  }catch(e){
    st.textContent='Couldn’t send automatically. Please use the button below.';
    document.getElementById('send').style.display='inline-block';
  }
}
try{votes=JSON.parse(localStorage.getItem('awards-votes')||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem('awards-votes',JSON.stringify(votes));}catch(e){}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mailBody(){return 'My award votes:\n\n'+CATS.map((c,i)=>c.title+': '+(votes[i]||'(no vote)')).join('\n');}
function render(){
  if(step<0){
    app.innerHTML=`<div class="hero"><div class="kick">Community Awards</div><h1>Pick your <span class="g">favorites</span> 🏆</h1>
    <p class="sub">Five categories. One vote each. Takes about a minute.</p>
    <div class="chips">${CATS.map((c,i)=>`<span><b>${i+1}</b> ${esc(c.title)}</span>`).join('')}</div>
    <div class="steps"><div><b>1</b>Tap your pick in each category</div><div><b>2</b>Hit Next to move on</div><div><b>3</b>Send your votes by email at the end</div></div>
    <button class="next" id="go">Start voting →</button></div>`;
    document.getElementById('go').onclick=()=>{step=0;render();};return;}
  if(step>=CATS.length){
    app.innerHTML=`<div class="kick">All done</div><h1>Thanks for voting! 🏆</h1><p class="sub">Your picks are in. Here’s what you chose:</p>
    <div class="sum">${CATS.map((c,i)=>`<div><span>${esc(c.title)}</span><b>${esc(votes[i]??'—')}</b></div>`).join('')}</div>
    <p class="sub note" id="st">Sending your votes…</p><a class="next mail" id="send" style="display:none" href="mailto:${MAIL}?subject=${encodeURIComponent('Awards votes')}&body=${encodeURIComponent(mailBody())}">✉ Send by email instead</a><br><button class="back" id="redo">Change my votes</button>`;
    sendVotes();
    document.getElementById('redo').onclick=()=>{try{localStorage.removeItem('awards-sent');}catch(e){}step=0;render();};return;}
  const c=CATS[step],sel=votes[step];
  app.innerHTML=`<div class="kick">Category ${step+1} of ${CATS.length}</div><h1>${esc(c.title)}</h1>
  <p class="sub">${c.type==='clip'?'Tap a clip to vote':'Tap a photo to vote'}</p>
  <div class="dots">${CATS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
  <div class="grid ${c.type==='clip'?'clips':''}">${c.items.map(it=>c.type==='clip'?
   `<div class="card ${sel===it.name?'sel':''}" role="button" tabindex="0" data-n="${esc(it.name)}"><div class="thumb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><em>${it.src}</em></div><div class="nm">${esc(it.name)}</div><a class="watch" href="${it.url}" target="_blank" rel="noopener">Watch clip ↗</a></div>`:
   `<div class="card ${sel===it.name?'sel':''}" role="button" tabindex="0" data-n="${esc(it.name)}"><img src="${photo(it.photo)}" alt="${esc(it.name)}"><div class="nm">${esc(it.name)}</div></div>`).join('')}</div>
  <div class="bar" id="bar"></div>${step>0?'<button class="back" id="bk">← Previous category</button>':''}`;
  const bar=document.getElementById('bar');
  const showNext=()=>{bar.innerHTML=`<button class="next" id="nx">${step===CATS.length-1?'Finish ✓':'Next category →'}</button>`;document.getElementById('nx').onclick=()=>{step++;render();window.scrollTo(0,0);};};
  if(sel)showNext();
  app.querySelectorAll('.card').forEach(el=>{
    const pick=e=>{if(e.target.closest('.watch'))return;votes[step]=el.dataset.n;save();app.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x===el));showNext();};
    el.addEventListener('click',pick);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e);}});
  });
  const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{step--;render();};
}
render();
</script></body></html>
